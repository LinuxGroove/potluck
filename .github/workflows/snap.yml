name: Snaps

# Builds three snaps: the game (potluck, from snap/), the always-on world
# server (potluck-server, from packaging/potluck-server/snap/) and the market
# with the relay (potluck-market, from packaging/potluck-market/snap/), which
# is also installed on the runner and tried. Publishing waits on the names
# being registered, the STORE_LOGIN secret and the PUBLISH_SNAP variable set
# to true.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# a new push to a pull request cancels the run it replaces
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snap:
    name: ${{ matrix.snap }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        snap: [potluck, potluck-server, potluck-market]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit and tag, so tools/version.sh can describe this one.
          fetch-depth: 0
      # The snap build can't see the runner's environment, so the version
      # (and the game's server key) go in files it reads.
      - name: Stamp the version
        run: tools/version.sh | tee VERSION
      # Sharing creations uses the LinuxGroove game server's key. It isn't
      # kept in the repository; builds without the secret (pull requests from
      # forks) keep "defaultkey" and can only share on a local server.
      - name: Set the game server key
        if: matrix.snap == 'potluck'
        env:
          GAME_SERVER_KEY: ${{ secrets.GAME_SERVER_KEY }}
        run: |
          if [ -z "$GAME_SERVER_KEY" ]; then
            echo "::warning::GAME_SERVER_KEY is not set; this build can't share on the public game server"
            exit 0
          fi
          case "$GAME_SERVER_KEY" in
            *[!A-Za-z0-9_-]*) echo "::error::GAME_SERVER_KEY may only contain letters, digits, '-' and '_'"; exit 1 ;;
          esac
          printf '%s\n' "$GAME_SERVER_KEY" > server.key
      - name: Choose the project
        id: project
        run: |
          if [ "${{ matrix.snap }}" != potluck ]; then
            tools/snap-project.sh "${{ matrix.snap }}" "build/${{ matrix.snap }}"
            cp VERSION "build/${{ matrix.snap }}/VERSION"
            echo "path=build/${{ matrix.snap }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: ${{ steps.project.outputs.path }}
      # Every part of the market answering on a machine of its own: Forgejo,
      # the market with its account there (creations go up as it starts), its
      # admin command, and the relay, with a certificate of its own since a
      # runner has no domain.
      - name: Try the market snap
        if: matrix.snap == 'potluck-market'
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost -days 2 -keyout key.pem -out cert.pem 2>/dev/null
          sudo cp cert.pem key.pem /var/snap/potluck-market/common/
          sudo snap set potluck-market relay.cert=cert.pem relay.key=key.pem
          up=""
          for i in $(seq 180); do
            if curl -sf -o /dev/null http://127.0.0.1:47180/api/key &&
              curl -sfk -o /dev/null --resolve localhost:8443:127.0.0.1 https://localhost:8443/ping; then
              up=yes
              break
            fi
            sleep 1
          done
          sudo potluck-market.info
          # the base game's creations, each a repository on Forgejo and a version on the market
          base=0
          for i in $(seq 180); do
            base="$(curl -s http://127.0.0.1:47180/api/base | jq '[.[] | select(.version > 0)] | length' 2>/dev/null || echo 0)"
            [ "${base:-0}" -ge 20 ] && break
            sleep 1
          done
          echo "base creations on the market: $base"
          token="$(sudo snap get potluck-market relay.token)"
          answer="$(curl -s -X POST -H "Authorization: Bearer $token" -H "X-Iroh-Endpoint-Id: $(printf '%064d' 0)" http://127.0.0.1:47180/api/relay/allow)"
          echo "the relay's check for a key the market never gave out: $answer"
          invite="$(sudo potluck-market.admin invite 1 || true)"
          echo "an invite code: $invite"
          if [ -z "$up" ] || [ "${base:-0}" -lt 20 ] || [ "$answer" != false ] || [ -z "$invite" ]; then
            sudo snap logs -n 300 potluck-market
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.snap }}-snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
      - name: Publish to the candidate channel
        if: vars.PUBLISH_SNAP == 'true' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'))
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: candidate
      - name: Publish to the edge channel
        if: vars.PUBLISH_SNAP == 'true' && github.event_name == 'push'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge

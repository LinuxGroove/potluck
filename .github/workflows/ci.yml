name: CI

on:
  push:
    branches: [main]
  pull_request:

# a new push to a pull request cancels the run it replaces
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Bevy with full debug info fills the runner's disk (the linker dies with a bus error)
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Bevy's build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the game and the server
        run: cargo build --locked --bins
      - name: Run tests
        run: cargo test --locked
      # the market's tests that need a real Forgejo (they skip above)
      - name: Run the market's tests against Forgejo
        run: deploy/market/test.sh
      - name: Build the game with ray tracing
        run: cargo build --locked --bin potluck --features raytracing

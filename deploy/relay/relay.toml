# iroh-relay at relay.potluck.linuxgroove.com, for worlds shared from home.
# It introduces the two games so they can find a way to each other through
# home routers, and carries the few connections that never find one (about
# one in ten). The market says which keys may use it: only games sharing or
# joining a world, while they do.
#
# It runs on a small machine of its own, since it takes ports 80 and 443
# itself (LetsEncrypt, then https) and UDP 7842 (QUIC, which tells games the
# address the internet sees them at, where hole punching starts).

enable_relay = true
http_bind_addr = "[::]:80"
enable_quic_addr_discovery = true
enable_metrics = true
# Prometheus text: relayserver bytes_sent and bytes_recv are what the
# monthly budget is watched by (docs/hosting.md)
metrics_bind_addr = "127.0.0.1:9090"

[tls]
cert_mode = "LetsEncrypt"
hostname = "relay.potluck.linuxgroove.com"
# who LetsEncrypt writes to about the certificate: set it before the first run
contact = "CHANGE-ME@example.org"
cert_dir = "/var/lib/iroh-relay/certs"
https_bind_addr = "[::]:443"
quic_bind_addr = "[::]:7842"

[limits]
# new connections a second, and in a burst
accept_conn_limit = 20.0
accept_conn_burst = 100

# What one game may send through the relay: 192 KB/s, about ten friends'
# worth of a world (each takes about 20 KB/s), with 4 MB at once so a
# friend's first download of the world (about 1.2 MB) isn't held up.
[limits.client.rx]
bytes_per_second = 196608
max_burst_bytes = 4194304

# The market answers "true" only for keys it gave out, with the token both
# share (IROH_RELAY_HTTP_BEARER_TOKEN here, RELAY_TOKEN for the market).
[access.http]
url = "https://potluck.linuxgroove.com/api/relay/allow"

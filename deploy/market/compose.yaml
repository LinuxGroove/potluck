# The market behind potluck.linuxgroove.com: Forgejo keeps every creation as
# a git repository (never public itself), potluck-share is the service and
# the web pages, and Caddy puts https in front. Players sign in through the
# game server (play.linuxgroove.com), which runs separately.
#
#   FORGEJO_TOKEN=... docker compose up -d     (see README.md here for the first run)

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    restart: unless-stopped
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__database__DB_TYPE: sqlite3
    volumes:
      - forgejo:/data
    # only the market talks to it
    expose:
      - "3000"

  market:
    build:
      context: ../..
      dockerfile: deploy/market/Dockerfile
    restart: unless-stopped
    depends_on:
      - forgejo
    environment:
      FORGEJO_TOKEN: ${FORGEJO_TOKEN:?the Forgejo admin token: see README.md}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ./share.toml:/etc/potluck-share/share.toml:ro
      - ./words.txt:/etc/potluck-share/words.txt:ro
      - market:/var/lib/potluck-share
    command: ["--config", "/etc/potluck-share/share.toml"]
    expose:
      - "47180"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - market
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  forgejo:
  market:
  caddy:

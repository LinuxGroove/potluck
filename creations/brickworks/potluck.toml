name = "Brickworks"
by = "Potluck"
kind = "mod"
about = "Blocks of fired clay: red bricks, terracotta, roof tiles, clay slabs and paper lanterns, made in a kiln. Each block is drawn in letters in potluck.toml, so change a colour or a row there and the world shows it."
main = "main.luau"
version = 1
licence = "CC-BY-4.0"

[needs]
world = "0.12"
tweak = "0.1"
ui = "0.1"
sound = "0.2"

# The blocks: each letter in a picture is a pixel, coloured by `colors`
# (. is see-through). A picture is 8, 16, 32 or 64 pixels square; `picture`
# is every side, or give a `top`, `side` and `bottom`. `kind` says how it
# sounds and which tools dig it (soft, hard, wood, plant or glass), and
# `hardness` how many seconds it takes to break by hand.


about = "A food bar beside your health in survival. When you get hungry you eat what you carry, each food as filling as it is: pies, stews, bread, fish, baked potatoes, fried eggs, carrots, apples, berries, milk and honey. On an empty belly you stop healing, and it slowly hurts you down to half health."

name = "Bees"
by = "Potluck"
kind = "creature"
about = "Bees buzz from flower to flower on the Green. Put down a beehive (a workbench makes one from planks and hay) near flowers, and bees come to live in it and fill it with honey: use a full hive to take two jars of honey. Leave them be: bop a bee in survival and it stings."
main = "main.luau"
version = 1
licence = "CC-BY-4.0"

[needs]
world = "0.20"
tweak = "0.1"
store = "0.1"
sound = "0.2"


name = "Gloomlings"
by = "Potluck"
kind = "creature"
about = "Little shadows that come out after dark and nip at anyone out in survival. They can't bear light, so a lantern by the door keeps them off, and they're gone by morning. Bop one twice to pop it, or once with a sword, and better swords bop harder. Arrows, stones from a sling and spears bop them from afar. A popped one leaves gloom dust. None on a Peaceful world, and fewer on a Gentle one."

name = "Circuits"
by = "Potluck"
kind = "mod"
about = "Copper wire carries power from levers, buttons, pressure plates and daylight sensors, through inverters and delays, to copper lamps and copper gates. Power is on or off. Inverters and delays face the way you put them down, take power from behind and give it out in front. Make the parts at a workbench."
main = "main.luau"
version = 1
licence = "CC-BY-4.0"

[needs]
world = "0.15"
tweak = "0.1"
store = "0.1"
ui = "0.2"
sound = "0.2"

# The blocks, each drawn in letters. Each part has an off look and an on
# look (a live wire, a pulled lever, a lit lamp), and the creation swaps
# one for the other. Wire's arms reach out only toward this creation's
# own blocks (joins), and inverters and delays turn to face the way
# they're put down (turns): their pictures are drawn facing north, the
# top row to the front.



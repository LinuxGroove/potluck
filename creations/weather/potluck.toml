about = "Rain, storms, snow, fog and wind, and four seasons of a week each. Summer is mostly fine, autumn wet and foggy, and in winter it snows. Crops grow fast in spring and summer and stop outdoors in winter (a greenhouse keeps them growing), the leaves turn in autumn, rain waters crops and puts out fires, storms strike tall trees, and winter nights are cold without wool, leather or a fire. Knobs set the length of a season or hold the weather."

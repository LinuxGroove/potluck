feeeeeeeeeeeeeed
feededeeeeedeeed
feeeeeeeeeeeeeed
feeeeedeeeeeeeed
feeeeeeeeeeeeeed
feeeeeeeeeedeeed
feedeeeeeeeeeeed
feeeeeeeeeeeeeed
dddddddddddddddc
................
................
................
"""
side = """

# A hammer on the anvil: a bright ring over a short knock.
[sounds.clink]
caption = "Hammering on an anvil"
wave = "triangle"
pitch = [1980, 1940]
length = 0.7
attack = 0.002
decay = 0.16

[[sounds.clink.layers]]
wave = "sine"
pitch = [3120, 3080]
length = 0.5
attack = 0.002
decay = 0.1
gain = 0.5

[[sounds.clink.layers]]
wave = "noise"

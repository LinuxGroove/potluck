name = "Tools"
by = "Potluck"
kind = "mod"
about = "Pickaxes, axes, shovels and hoes for survival, in wood, stone, copper, iron and moonsilver. Hold one and its kind of block breaks faster, and better ones reach harder ores. They wear as they work and a worn out one breaks. Shears cut leaves and plants, a sickle reaps crops and a hammer breaks stone three by three. Make wooden, stone and copper tools, shears, sickles and hammers at a workbench, and iron and moonsilver ones at an anvil, which mends them all and makes iron and moonsilver armor too."
main = "main.luau"
version = 1
licence = "CC-BY-4.0"

[needs]
world = "0.17"
tweak = "0.1"
ui = "0.2"
sound = "0.2"

# The anvil, made at a workbench from iron: a foot, a waist and a long
# face, in sixteenths of a block. It turns to face the way it's put down,
# drawn facing north (the face runs east to west across the player's view).
[blocks.anvil]
name = "Anvil"
kind = "hard"
hardness = 3
turns = true
boxes = [
	[1, 0, 3, 15, 3, 13],
	[4, 3, 5, 12, 9, 11],
	[0, 9, 3, 16, 14, 13],
]
colors = { a = "#1d1f24", b = "#2c2f35", c = "#3d4148", d = "#50555d", e = "#666c74", f = "#868c93", g = "#a6abb1" }
top = """

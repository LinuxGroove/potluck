name = "Storage"
by = "Potluck"
kind = "mod"
about = "Crates and barrels keep what you put in them, in survival: use one holding something to put it in, or to take things out. A dispenser gives out what it holds, a thing each time power reaches it: it puts a block down in front of it, pours water, fills a bucket or hands the thing to someone near. A chute moves things down from what's over it into what's under it, a crate, barrel, dispenser or another chute, unless it has power. Make them at a workbench."
main = "main.luau"
version = 1
licence = "CC-BY-4.0"

[needs]
world = "0.15"
tweak = "0.1"
ui = "0.1"
sound = "0.1"
store = "0.1"

# What dispensers and chutes are: a dispenser gives out what it holds, one
# thing each time power reaches it; a chute moves things down from what's
# over it into what's under it.
[blocks.dispenser]
name = "Dispenser"
kind = "hard"
hardness = 2
turns = true
# a cobblestone body with a spout at the front, where things come out

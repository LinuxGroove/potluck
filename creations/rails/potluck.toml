name = "Rails and carts"
by = "Potluck"
kind = "mod"
about = "Lay rails and ride a cart along them. Rails join the rails beside them by themselves, bending round corners and sloping up a block. Powered rails beside live wire, a pulled lever or a lit inverter speed a cart up, and without power they slow it to a stop. Make rails, powered rails and carts at a workbench."
main = "main.luau"
version = 1
licence = "CC-BY-4.0"

[needs]
world = "0.23"
tweak = "0.1"
store = "0.1"
input = "0.1"
ui = "0.2"
sound = "0.2"

# Buttons while riding a cart
[actions.push]
name = "Push off"
pad = "A"
keys = "Space"

[actions.brake]
name = "Brake"
pad = "X"
keys = "F"

[sounds.rumble]
caption = "A cart rumbles"
wave = "noise"
pitch = 260
length = 0.5
attack = 0.05
lowpass = 500

[sounds.clack]
caption = "Wheels clack"
wave = "square"
pitch = [160, 120]
length = 0.08
attack = 0.003
lowpass = 1200

# The rails, drawn running north to south: a bed of gravel and sleepers a
# little above the ground. A bend joins the south side to the east, and a
# slope climbs a block toward the north, in steps.

[blocks.rail]
name = "Rail"
kind = "hard"
hardness = 0.7
solid = false
turns = true
boxes = [[0, 0, 0, 16, 2, 16]]
colors = { g = "#5b5651", h = "#4a4541", k = "#696460", w = "#7a5634", x = "#5e4127", r = "#c3c8ce", s = "#7f858c", o = "#e0b24a", p = "#9c7a2c", c = "#d8743c" }

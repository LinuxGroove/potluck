name = "Lost packs"
by = "Potluck"
kind = "mod"
about = "On a Normal or Hard world, a player hurt too badly in survival drops everything they carry in a pack where they fell: go back and use the pack to take it all back (anyone can, so be quick). On Peaceful and Gentle worlds you keep what you carry. What you wear stays on."
main = "main.luau"
version = 1
licence = "CC-BY-4.0"

[needs]
world = "0.21"
tweak = "0.1"
store = "0.1"
ui = "0.2"
sound = "0.2"

# a leather satchel with its flap down and a brass buckle

name = "Gnome Diggings"
by = "Potluck"
kind = "world"
about = "Long ago the Gnome Gardeners' people dug into the hills. Walk far from the Green and you'll come upon their diggings in a steep hillside: a timbered tunnel with old cart tracks, a slope down into the rock, a forge room, a store room and a long dark drift beyond. Bring a light. Burnt-out lanterns light again with a piece of coal, and gnome crates hold what the diggers left behind: tools, ore, ingots, seeds, a brass compass for collectors, and torn maps that lead to a crate buried out on the land."
main = "main.luau"
version = 1
licence = "CC-BY-4.0"

[needs]
world = "0.25"
tweak = "0.1"
store = "0.1"
ui = "0.2"
sound = "0.2"


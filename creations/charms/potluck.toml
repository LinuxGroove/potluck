name = "Charms"
by = "Potluck"
kind = "mod"
about = "A charm table puts charms on the tool, weapon or armor in your hand, for XP and a little gloom dust: Swift digs faster, Sturdy wears half as fast, Keen hits harder and Warm keeps the winter cold off. Make the table at a workbench from gold, a crystal and planks."
main = "main.luau"
version = 1
licence = "CC-BY-4.0"

[needs]
world = "0.22"
tweak = "0.1"
ui = "0.2"
sound = "0.2"

# The charm table: a dark wooden top on a carved stone foot, with a
# crystal on it that glows, in sixteenths of a block.
[blocks.charm_table]

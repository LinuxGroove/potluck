name = "Furnaces and campfires"
by = "Potluck"
kind = "mod"
about = "A furnace smelts raw metal into ingots, logs into charcoal, sand into glass and cobblestone into stone, and cooks bread, roasted carrots and fish, burning coal, charcoal, logs or planks. A campfire cooks with no fuel, and its light keeps Gloomlings away. Make both at a workbench."
main = "main.luau"
version = 1
licence = "CC-BY-4.0"

[needs]
world = "0.14"
tweak = "0.1"
store = "0.1"
ui = "0.2"
sound = "0.2"

# The blocks, each drawn in letters. A lit furnace and a campfire show their
# first pictures and then each of their frames in turn, `speed` a second (a
# frame gives only the faces that change: the furnace's sides). Players
# with Reduce flashing on see only the first.

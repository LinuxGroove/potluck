[package]
name = "potluck"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A block sandbox where everything is made by someone you know"

[dependencies]
bevy = "0.20.1"
mlua = { version = "0.12.3", features = ["luau", "vendored", "send"] }
ureq = "3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ctrlc = { version = "3.5.3", features = ["termination"] }
# the market: its signed manifests, files by hash, and QR codes for phones
ed25519-dalek = "3"
sha2 = "0.11"
base64 = "0.22"
qrcode = { version = "0.15", default-features = false, features = ["std"] }
# the dev bridge's screenshots, as PNG (the same image crate Bevy uses)
image = { version = "0.25", default-features = false, features = ["png"] }
# sharing a world from home: QUIC dialled by key, through NATs, with our relay as the fallback
iroh = "1.5"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[features]
# Ultra lighting ray traced with Bevy's Solari, on graphics cards that can
raytracing = ["bevy/bevy_solari"]

[[bin]]
name = "potluck"
path = "src/main.rs"
# the tests are in the library
test = false

[[bin]]
name = "potluck-server"
path = "src/server.rs"
# the tests are in the library
test = false

[[bin]]
name = "potluck-bots"
path = "src/bots.rs"
test = false

[dev-dependencies]
# the market itself, run in the tests that share from the game
potluck-share = { path = "../share-service" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
# a relay in the tests, so sharing is tested with no internet
iroh = { version = "1.5", features = ["test-utils"] }
iroh-relay = { version = "1.5", features = ["server"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }

# libasound's config in the snap (ALSA_CONFIG_PATH): everything plays
# through the desktop's sound server, PulseAudio or PipeWire standing in for
# it, which the audio-playback plug lets the snap reach.
pcm.!default {
    type pulse
    hint {
        show on
        description "The desktop's sound"
    }
}
ctl.!default {
    type pulse
}
